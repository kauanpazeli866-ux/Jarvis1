function findImg(o){if(!o||typeof o!=='object')return null;if(typeof o.data==='string'&&o.data.length>2000)return{d:o.data,m:o.mime_type||o.mimeType||(o.data.startsWith('/9j/')?'image/jpeg':'image/png')};for(const k in o){const r=findImg(o[k]);if(r)return r}return null}
async function imgCall(k,model,p){
 const modes=model==='gemini-2.5-flash-image'?['gc','int']:['int','gc'];let last='';
 for(const md of modes){
  try{
   const u=md==='int'?'https://generativelanguage.googleapis.com/v1beta/interactions?key='+encodeURIComponent(k):GU+model+':generateContent?key='+encodeURIComponent(k);
   const body=md==='int'?{model,input:[{type:'text',text:p}]}:{contents:[{parts:[{text:p}]}],generationConfig:{responseModalities:['TEXT','IMAGE']}};
   const r=await fetch(u,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
   const d=await r.json().catch(()=>({}));
   if(!r.ok){last=r.status+' '+(((d.error&&d.error.message)||'')+'').slice(0,160);if(r.status===429||r.status===401||r.status===403)break;continue}
   const im=findImg(d);if(im)return im;last='a resposta veio sem imagem'
  }catch(e){last='falha de rede'}}
 throw new Error(last||'erro')}
async function genImage(p){
 if(!getK()){showAct('Para criar imagens preciso da chave do Gemini. Veja Configurações > APIs.');return}
 if(!p)return;
 showAct('Criando a imagem…');$('img').hidden=true;B.classList.remove('hasimg');
 try{const im=await imgCall(getK(),cg('imgm'),p);showImg(im,p)}
 catch(e){showAct('Não consegui criar a imagem ('+e.message+')')}}
function showImg(im,p){const b=$('img');b.innerHTML='';const url=URL.createObjectURL(b64blob(im.d,im.m)),i=document.createElement('img');i.src=url;i.alt=p;const r=mk('div','ir'),a=mk('a','','Salvar');a.href=url;a.download='jarvis-imagem.'+(im.m.indexOf('jpeg')>=0?'jpg':'png');const c=mk('button','','Fechar');c.type='button';c.onclick=()=>{b.hidden=true;b.innerHTML='';B.classList.remove('hasimg');URL.revokeObjectURL(url)};r.append(a,c);b.append(i,r);b.hidden=false;B.classList.add('hasimg');$('act').hidden=true}

function loadImg(f){return new Promise((ok,no)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const w=Math.min(1280,im.naturalWidth),h=Math.round(im.naturalHeight*w/im.naturalWidth),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.7).split(',')[1])};im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('img'))};im.src=u})}
function grabFrame(){if(!shv||!shv.videoWidth)return null;const w=Math.min(1280,shv.videoWidth),h=Math.round(shv.videoHeight*w/shv.videoWidth),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(shv,0,0,w,h);return{d:c.toDataURL('image/jpeg',.6).split(',')[1],m:'image/jpeg',src:'tela'}}

   const b=mk('button','bt'+(c.dg?' dg':''),c.l);b.type='button';b.onclick=c.f;w.append(b);return w}
